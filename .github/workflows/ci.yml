name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and standalone plugin
        run: docker compose -f docker/compose.yaml run --rm --build unit-tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qt display build, catalog test, and noVNC page
        run: |
          docker build -f docker/Dockerfile.display -t ogw-display .
          docker rm -f ogw-novnc >/dev/null 2>&1 || true
          docker run -d --name ogw-novnc -p 6080:6080 ogw-display
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          docker rm -f ogw-novnc >/dev/null
          test "$ready" = 1

  integration:
    runs-on: ubuntu-latest
    needs: [unit, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Container demo
        run: docker compose -f docker/compose.yaml -f docker/compose.test.yaml up --build --abort-on-container-exit --exit-code-from live-tests
